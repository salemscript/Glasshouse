<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-labelledby="title desc">
 <title id="title">Original Glasshouse reconstruction of Problem51 geometry</title>
 <desc id="desc">A rectangle15centimeters wide and5centimeters high has fixed negative5microcoulomb q1 at top-left and fixed positive2microcoulomb q2 at bottom-right. A is top-right andB bottom-left. A dashed diagonal teaching overlay shows positive3microcoulomb q3 moving fromB toA. This is independently drawn from the inspected source PDF,not original textbook artwork.</desc>
 <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#55999c"/></marker></defs>
 <rect width="640" height="290" rx="12" fill="#fffdf5"/>
 <g font-family="Arial,sans-serif" fill="#263c3e" font-size="15">
  <text x="320" y="20" text-anchor="middle" font-size="13">Original Glasshouse reconstruction · actual Problem51 corner geometry</text>
  <g fill="none" stroke="#6b7771" stroke-width="1.5">
   <path d="M130 75H490V195H130Z" stroke-dasharray="7 5"/>
   <path d="M130 37H490M130 32V42M490 32V42"/>
   <path d="M80 75V195M75 75H85M75 195H85"/>
  </g>
  <text x="310" y="33" text-anchor="middle">15 cm = 0.15 m</text>
  <text x="55" y="136" text-anchor="middle" transform="rotate(-90 55 136)">5.0 cm = 0.050 m</text>
  <circle cx="130" cy="75" r="12" fill="#e96658"/>
  <path d="M123 75H137" stroke="#fffdf5" stroke-width="3"/>
  <text x="130" y="59" text-anchor="middle">q1 = −5.0 μC</text>
  <circle cx="490" cy="195" r="12" fill="#e96658"/>
  <path d="M483 195H497M490 188V202" stroke="#fffdf5" stroke-width="3"/>
  <text x="490" y="225" text-anchor="middle">q2 = +2.0 μC</text>
  <circle cx="130" cy="195" r="6" fill="#fffdf5" stroke="#55999c" stroke-width="2"/>
  <circle cx="490" cy="75" r="6" fill="#fffdf5" stroke="#55999c" stroke-width="2"/>
  <text x="510" y="80">A · final</text><text x="130" y="221" text-anchor="middle">B · start</text>
  <path d="M140 192L480 78" stroke="#55999c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="310" y="172" text-anchor="middle" fill="#36777a">q3 = +3.0 μC : B → A</text>
  <text x="320" y="252" text-anchor="middle" font-size="12">Dashed diagonal is an added transfer teaching overlay; source dimensions are from text.</text>
  <text x="320" y="273" text-anchor="middle" font-size="12">Original drawing from inspected PDF page29 / printed713; not original textbook artwork.</text>
 </g>
</svg>
