<g font-family="system-ui,sans-serif" fill="#293538" text-anchor="middle" font-size="16"><text x="95" y="530">sp₁ → σCH</text><text x="205" y="530">sp₂ → σCH</text><text x="315" y="530">2p_y</text><text x="425" y="530">2p_z</text><text x="650" y="530">sp²₁ → σCH</text><text x="760" y="530">sp²₂ → σCH</text><text x="870" y="530">sp²ₙ</text><text x="980" y="530">2p empty</text></g>
<g font-family="system-ui,sans-serif" fill="#58696b" font-size="16"><text x="25" y="565">Schematic 3D projection: A has orthogonal p_y/p_z; B has p perpendicular to its sp² plane.</text><text x="25" y="593">Each C bonding ↑ pairs with H1s: two C–H σ bonds contain four electrons; two electrons remain nonbonding.</text><text x="25" y="621">Four carbon valence-basis orbitals remain in both pictures. The C1s core orbital is not shown.</text><text x="25" y="649">Actual ground-state triplet CH₂ is bent (NIST C₂v), NOT the ideal linear picture in A.</text></g>
