<g font-family="system-ui,sans-serif" fill="#293538" text-anchor="middle"><text x="818" y="257" font-size="24">C</text><text x="743" y="145" font-size="22">H</text><text x="743" y="367" font-size="22">H</text><text x="772" y="185" font-size="16">sp²₁</text><text x="772" y="329" font-size="16">sp²₂</text><text x="898" y="245" font-size="16">sp²ₙ</text><text x="852" y="144" font-size="16">2p</text><text x="820" y="386" font-size="16">Ideal in-plane hybrid separation: 120°</text></g>
