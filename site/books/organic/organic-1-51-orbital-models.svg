<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="675" viewBox="0 0 1120 675" role="img" aria-labelledby="t d">
<title id="t">Original ideal orbital candidates for methylene</title><desc id="d">A is an ideal linear sp basis: two sp lobes make C–H sigma bonds, while orthogonal py and pz orbitals each contain one nonbonding electron. B is an ideal sp2 basis: two hybrids make C–H bonds, a third contains an opposite-spin pair, and the perpendicular p is empty. Occupancy boxes show carbon electron contributions before bonding to H1s; each bonding carbon electron pairs with the corresponding hydrogen electron. These are idealized orbital pictures, not measured CH2 geometries.</desc>
<rect width="1120" height="675" rx="16" fill="#fff8eb"/>
<g font-family="system-ui,sans-serif" fill="#293538"><text x="25" y="34" font-size="22">Original orbital candidates · explicitly idealized basis pictures</text><text x="25" y="64" font-size="16">Lobes show orbital directions, not trajectories. Shading separates orbital families; it is not charge.</text><text x="30" y="103" font-size="21">Candidate A</text><text x="585" y="103" font-size="21">Candidate B</text></g>
<g stroke="#507b7e" stroke-width="2" fill="#b6d3cc"><ellipse cx="260" cy="196" rx="27" ry="54"/><ellipse cx="260" cy="304" rx="27" ry="54"/><ellipse cx="200" cy="250" rx="57" ry="25"/><ellipse cx="320" cy="250" rx="57" ry="25"/></g>
<g stroke="#b7675b" stroke-width="2" fill="#efd0bd"><ellipse cx="225" cy="285" rx="23" ry="52" transform="rotate(45 225 285)"/><ellipse cx="295" cy="215" rx="23" ry="52" transform="rotate(45 295 215)"/></g>
<g stroke="#365358" stroke-width="2.5" fill="none"><path d="M140 250H380 M260 150V350"/><path d="M195 315L325 185" stroke-dasharray="5 4"/><path d="M205 250H125 M315 250H395"/></g>
<g font-family="system-ui,sans-serif" fill="#293538" text-anchor="middle"><text x="260" y="257" font-size="24">C</text><text x="110" y="257" font-size="22">H</text><text x="410" y="257" font-size="22">H</text><text x="170" y="240" font-size="16">sp₁</text><text x="350" y="240" font-size="16">sp₂</text><text x="280" y="151" font-size="17">2p_y</text><text x="345" y="183" font-size="17">2p_z</text><text x="260" y="386" font-size="16">Ideal bond axis: 180° only in this construction</text></g>
<g stroke="#507b7e" stroke-width="2" fill="#b6d3cc"><ellipse cx="790" cy="299" rx="55" ry="22" transform="rotate(-60 790 299)"/><ellipse cx="790" cy="201" rx="55" ry="22" transform="rotate(60 790 201)"/><ellipse cx="882" cy="250" rx="58" ry="25"/></g>
