<svg xmlns="http://www.w3.org/2000/svg" width="920" height="710" viewBox="0 0 920 710" role="img" aria-labelledby="title desc">
<title id="title">Carbon identity map for Organic 1-39</title><desc id="desc">Original connectivity graph. A1 through A13 are procaine carbons; B1 through B6 are vitamin C carbons. Node labels give carbon identity, not hybridization. Bonds preserve the textbook connectivity. No stereochemistry assigned.</desc>
<rect width="920" height="710" fill="#fff8ee"/>
<g fill="#203c42" font-family="sans-serif"><text x="24" y="30" font-size="22">(a) Procaine source salt — all 13 carbons</text><text x="500" y="360" font-size="22">(b) Vitamin C — all 6 carbons</text><text x="24" y="687" font-size="17">Every A/B node is one carbon. O, N, H and Cl remain explicit. No stereochemistry is assigned.</text></g>
<g stroke="#203c42" stroke-width="3" fill="none">
