<title id="title">Pyridoxal phosphate: original CALX atom identity map</title><desc id="desc">C1 through C5 and N1 form the pyridine ring. C6 is methyl, C7 aldehyde and C8 phosphate side chain. O1 is hydroxyl oxygen and O2 bridges C8 to P1. All four terminal oxygen atoms are shown without assignment IDs: the aldehyde carbonyl oxygen, the phosphate double-bonded oxygen, and two anionic phosphate oxygens.</desc>
<rect width="940" height="420" rx="16" fill="#fff8eb"/><g font-family="system-ui,sans-serif" fill="#293538"><text x="32" y="36" font-size="22">Pyridoxal phosphate · identify each nonterminal site</text><text x="32" y="66" font-size="16">Atom IDs locate sites; they do not give hybridization answers.</text></g>
<g stroke="#365358" stroke-width="3" fill="none"><path d="M260 177L325 214L325 290L260 327L195 290L195 214Z M312 224L312 280 M248 314L206 290 M205 219L251 191 M260 177V126 M325 214L387 178L445 214 M488 214L543 214 M573 196V154 M583 196V154 M592 214L640 214 M578 234V278 M195 214L146 186 M114 186H83 M195 290L132 326"/><path d="M250 112L218 94 M250 119L212 100 M272 113L300 96"/></g>
<g font-family="system-ui,sans-serif" font-size="21" text-anchor="middle" fill="#293538">
<g fill="#fff8eb" stroke="#d6bdb0"><rect x="239" y="163" width="42" height="28" rx="6"/><rect x="305" y="200" width="42" height="28" rx="6"/><rect x="305" y="276" width="42" height="28" rx="6"/><rect x="237" y="313" width="47" height="28" rx="6"/><rect x="175" y="276" width="42" height="28" rx="6"/><rect x="175" y="200" width="42" height="28" rx="6"/><rect x="98" y="313" width="43" height="28" rx="6"/><rect x="241" y="101" width="42" height="28" rx="6"/><rect x="366" y="164" width="42" height="28" rx="6"/><rect x="110" y="170" width="42" height="28" rx="6"/><rect x="445" y="200" width="44" height="28" rx="6"/><rect x="550" y="200" width="51" height="28" rx="6"/></g>
<text x="260" y="185">C1</text><text x="326" y="222">C2</text><text x="326" y="298">C3</text><text x="260" y="335">N1</text><text x="196" y="298">C4</text><text x="196" y="222">C5</text><text x="119" y="335">C6</text><text x="262" y="123">C7</text><text x="387" y="186">C8</text><text x="131" y="192">O1</text><text x="467" y="222">O2</text><text x="576" y="222">P1</text>
<text x="204" y="99">O</text><text x="311" y="99">H</text><text x="69" y="194">H</text><text x="578" y="146">O</text><text x="658" y="221">O⁻</text><text x="578" y="300">O⁻</text></g>
<g font-family="system-ui,sans-serif" font-size="16" fill="#58696b"><text x="32" y="375">C6 = CH₃; C8 = CH₂; C3 = ring CH. Other implicit H are retained by valence.</text><text x="32" y="399">Nonterminal includes atoms bonded to H: O1 is O–H. Unlabeled terminal O sites have one neighbor.</text></g>
